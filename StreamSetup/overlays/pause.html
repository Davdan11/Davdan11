<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <title>Pause</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .chrono {
      font-size: 30px;
      font-weight: 600;
      color: var(--texte-pale);
      font-variant-numeric: tabular-nums;
    }
    .chrono strong {
      color: var(--texte-doux);
      font-weight: 700;
    }
    .icone-pause {
      display: flex;
      gap: 22px;
      height: 120px;
      margin-bottom: 6px;
    }
    .icone-pause span {
      width: 38px;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      animation: barre-pause 2.4s ease-in-out infinite;
    }
    .icone-pause span:last-child { animation-delay: 0.3s; }
    @keyframes barre-pause {
      0%, 100% { opacity: 1; transform: scaleY(1); }
      50% { opacity: 0.6; transform: scaleY(0.86); }
    }
  </style>
</head>
<body>
  <div class="ecran">
    <div class="fond" aria-hidden="true">
      <div class="halo halo-1"></div>
      <div class="halo halo-2"></div>
      <div class="halo halo-3"></div>
      <div class="grille"></div>
      <div class="grain"></div>
      <div class="vignette"></div>
    </div>

    <main class="centre">
      <div class="icone-pause entree" aria-hidden="true"><span></span><span></span></div>
      <h1 class="titre degrade entree entree-2" data-cfg="pause.titre"></h1>
      <div class="message rotation entree entree-3" id="messages"></div>
      <div class="chrono entree entree-4">En pause depuis <strong id="chrono">00:00</strong></div>
    </main>

    <footer class="pied entree entree-4">
      <div class="reseaux" id="reseaux"></div>
      <div class="pastille"><span class="point direct"></span><span data-cfg="nom"></span></div>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="commun.js"></script>
  <script>
    (function () {
      var H = window.Habillage;
      var depart = Date.now();
      var chrono = document.getElementById("chrono");
      setInterval(function () {
        chrono.textContent = H.formatDuree(Date.now() - depart);
      }, 1000);
      H.messages(document.getElementById("messages"), 6500);
      H.reseaux(document.getElementById("reseaux"));
    })();
  </script>
</body>
</html>
